<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Tooltip Demo</title>
  <link rel="stylesheet" href="task2.css">
</head>
<body>
  <header>
    <h1>Pure CSS Tooltip Demonstration</h1>
  </header>

  <main class="tooltip-container">
    <div class="tooltip-item">
      <span class="icon">⭐</span>
      <span class="tooltip-text">This is a star icon</span>
    </div>

    <div class="tooltip-item">
      <span class="icon">🔍</span>
      <span class="tooltip-text">Search functionality</span>
    </div>

    <div class="tooltip-item">
      <span class="icon">Settings</span>
      <span class="tooltip-text">Open settings menu</span>
    </div>

    <div class="tooltip-item">
      <span class="icon">Help</span>
      <span class="tooltip-text">Get assistance here</span>
    </div>
  </main>
</body>
</html>
