<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini UI Layout</title>
  <link rel="stylesheet" href="task10.css">
</head>
<body>
  <header class="site-header">
    <h1>MyApp</h1>
  </header>

  <main class="main-content">
    <section class="card">
      <img src="https://picsum.photos/id/64/120/120" alt="Profile avatar" class="card-image">

      <h2>Contact Us</h2>

      <form class="card-form">
        <label for="name">Name</label>
        <input type="text" id="name" class="input-field" placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" class="input-field" placeholder="Your email">

        <label for="message">Message</label>
        <textarea id="message" class="input-field" rows="3" placeholder="Your message"></textarea>

        <div class="form-buttons">
          <button type="submit" class="btn btn-submit">Send</button>
          <button type="reset" class="btn btn-reset">Clear</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
