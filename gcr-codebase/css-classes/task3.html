<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="task3.css">
</head>
<body>
  <header>
    <h1>Image Showcase Gallery</h1>
  </header>

  <main class="gallery">
    <figure class="gallery-item">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/10/400/300" alt="Forest landscape">
      </div>
      <figcaption>Forest Landscape</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/20/400/300" alt="City street">
      </div>
      <figcaption>City Street</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/30/400/300" alt="Mountain view">
      </div>
      <figcaption>Mountain View</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/40/400/300" alt="Ocean waves">
      </div>
      <figcaption>Ocean Waves</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/50/400/300" alt="Desert dunes">
      </div>
      <figcaption>Desert Dunes</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="image-wrapper">
        <img src="https://picsum.photos/id/60/400/300" alt="Autumn trees">
      </div>
      <figcaption>Autumn Trees</figcaption>
    </figure>
  </main>
</body>
</html>
