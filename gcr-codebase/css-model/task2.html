<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Height and Width Practice Layout</title>
  <link rel="stylesheet" href="task2.css">
</head>
<body>

  <header>
    <h1>Height & Width Practice Layout</h1>
  </header>

  <main>
    <div class="box box-px">
      <h2>Box 1</h2>
      <p>width: 250px; height: 150px;</p>
    </div>

    <div class="box box-percent">
      <h2>Box 2</h2>
      <p>width: 40%; max-width: 320px; min-height: 200px;</p>
      <p>Extra text to demonstrate overflow behaviour inside a fixed-height container when content grows longer than the visible area.</p>
    </div>

    <div class="box box-vh-em">
      <h2>Box 3</h2>
      <p>height: 25vh; width: 20em;</p>
    </div>
  </main>



</body>
</html>
