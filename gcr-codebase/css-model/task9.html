<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outline and Focus Styling Form</title>
  <link rel="stylesheet" href="task9.css">
</head>
<body>

  <header>
    <h1>Outline & Focus Styling Form</h1>
  </header>

  <main>
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" class="field-solid" placeholder="Solid outline on focus">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="field-dashed" placeholder="Dashed outline with offset">
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" class="field-dotted" placeholder="Dotted outline">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" class="field-solid" rows="5" placeholder="Type your message here..."></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>


</body>
</html>
