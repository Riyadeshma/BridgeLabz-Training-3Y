<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadows and Depth Effect Layout</title>
  <link rel="stylesheet" href="task4.css">
</head>
<body>

  <header>
    <h1>Shadows & Depth Effects</h1>
  </header>

  <main class="card-row">
    <article class="card card-1">
      <h2>Soft Shadow</h2>
      <p>A gentle, diffused box-shadow gives this card a subtle lift off the page.</p>
    </article>

    <article class="card card-2">
      <h2>Sharp Shadow</h2>
      <p>A tighter, darker shadow creates a crisper sense of elevation.</p>
    </article>

    <article class="card card-3">
      <h2>Colored Shadow</h2>
      <p>A tinted shadow adds a splash of color beneath the card.</p>
    </article>
  </main>



</body>
</html>
