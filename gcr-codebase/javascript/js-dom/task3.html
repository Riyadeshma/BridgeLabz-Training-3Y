<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    .step { display: none; }
    .step.active { display: block; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-size: 16px; }
    .error { color: red; min-height: 20px; font-size: 14px; margin: 6px 0; }
    .buttons { display: flex; justify-content: space-between; margin-top: 12px; }
    button { padding: 8px 18px; cursor: pointer; border: none; border-radius: 4px; background: #2d89ef; color: #fff; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #summary { display: none; }
    #summary.active { display: block; }
    #stepIndicator { color: #555; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>Registration</h2>
  <div id="stepIndicator">Step 1 of 3</div>

  <div id="formArea">
    <div class="step active">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="Enter your name">
      <div class="error"></div>
    </div>

    <div class="step">
      <label for="emailInput">Email</label>
      <input type="text" id="emailInput" placeholder="Enter your email">
      <div class="error"></div>
    </div>

    <div class="step">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="At least 6 characters">
      <div class="error"></div>
    </div>

    <div class="buttons">
      <button id="backButton" disabled>Back</button>
      <button id="nextButton">Next</button>
    </div>
  </div>

  <div id="summary">
    <h3>Summary</h3>
    <p><strong>Name:</strong> <span id="summaryName"></span></p>
    <p><strong>Email:</strong> <span id="summaryEmail"></span></p>
    <p><strong>Password:</strong> <span id="summaryPassword"></span></p>
    <button id="restartButton">Start Over</button>
  </div>

  <script>
    const steps = document.querySelectorAll(".step");
    const stepIndicator = document.getElementById("stepIndicator");
    const backButton = document.getElementById("backButton");
    const nextButton = document.getElementById("nextButton");
    const formArea = document.getElementById("formArea");
    const summary = document.getElementById("summary");

    const nameInput = document.getElementById("nameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");

    let currentStep = 0;   // 0, 1, 2

    // Each validator returns an error message, or "" when the value is valid
    const validators = [
      () => (nameInput.value.trim().length >= 2 ? "" : "Name must be at least 2 characters."),
      () => (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim()) ? "" : "Enter a valid email address."),
      () => (passwordInput.value.length >= 6 ? "" : "Password must be at least 6 characters.")
    ];

    // Shows only the current step and updates the buttons
    function showStep() {
      steps.forEach((step, index) => {
        step.classList.toggle("active", index === currentStep);
      });
      stepIndicator.textContent = "Step " + (currentStep + 1) + " of 3";
      backButton.disabled = currentStep === 0;
      nextButton.textContent = currentStep === steps.length - 1 ? "Finish" : "Next";
    }

    function showSummary() {
      document.getElementById("summaryName").textContent = nameInput.value.trim();
      document.getElementById("summaryEmail").textContent = emailInput.value.trim();
      document.getElementById("summaryPassword").textContent = "*".repeat(passwordInput.value.length);
      formArea.style.display = "none";
      stepIndicator.style.display = "none";
      summary.classList.add("active");
    }

    nextButton.addEventListener("click", () => {
      const errorBox = steps[currentStep].querySelector(".error");
      const errorMessage = validators[currentStep]();
      errorBox.textContent = errorMessage;

      if (errorMessage !== "") return;   // stay on this step until valid

      if (currentStep === steps.length - 1) {
        showSummary();                   // all 3 steps complete
      } else {
        currentStep++;
        showStep();
      }
    });

    backButton.addEventListener("click", () => {
      if (currentStep > 0) {
        currentStep--;
        showStep();
      }
    });

    document.getElementById("restartButton").addEventListener("click", () => {
      nameInput.value = emailInput.value = passwordInput.value = "";
      currentStep = 0;
      summary.classList.remove("active");
      formArea.style.display = "block";
      stepIndicator.style.display = "block";
      showStep();
    });
  </script>
</body>
</html>
