<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Logger</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    #trackingBox { position: relative; width: 400px; height: 400px; border: 2px solid #333;
                   box-sizing: border-box; background: #f5f5f5; cursor: crosshair; overflow: hidden; }
    .dot { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%;
           transform: translate(-50%, -50%); pointer-events: none; }
    #coordinates { margin-top: 12px; font-size: 18px; }
  </style>
</head>
<body>
  <h2>Mouse Coordinates Logger</h2>
  <p>Move the mouse inside the box. Double-click to drop a red dot.</p>

  <div id="trackingBox"></div>
  <div id="coordinates">clientX: -, clientY: -</div>

  <script>
    const trackingBox = document.getElementById("trackingBox");
    const coordinatesDisplay = document.getElementById("coordinates");

    // Live coordinates while the mouse moves inside the box
    trackingBox.addEventListener("mousemove", (event) => {
      coordinatesDisplay.textContent = "clientX: " + event.clientX + ", clientY: " + event.clientY;
    });

    trackingBox.addEventListener("mouseleave", () => {
      coordinatesDisplay.textContent = "Mouse is outside the box";
    });

    // Double-click drops a red dot at the clicked position
    trackingBox.addEventListener("dblclick", (event) => {
      const boxPosition = trackingBox.getBoundingClientRect();

      // Convert page (client) coordinates to coordinates inside the box
      const dotX = event.clientX - boxPosition.left - trackingBox.clientLeft;
      const dotY = event.clientY - boxPosition.top - trackingBox.clientTop;

      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.left = dotX + "px";
      dot.style.top = dotY + "px";
      trackingBox.appendChild(dot);
    });
  </script>
</body>
</html>
