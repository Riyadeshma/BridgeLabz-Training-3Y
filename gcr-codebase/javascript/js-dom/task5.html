<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; }
    #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 800px; margin: 0 auto; }
    #gallery img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
    #gallery img:hover { transform: scale(1.03); }

    /* Full-screen dark overlay */
    #modalOverlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
                    justify-content: center; align-items: center; z-index: 10; }
    #modalOverlay.open { display: flex; }

    /* The white box inside the overlay */
    #modalContent { background: #fff; padding: 12px; border-radius: 8px; max-width: 90vw; max-height: 90vh; }
    #modalContent img { display: block; max-width: 100%; max-height: 80vh; }
    #modalCaption { text-align: center; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h2 style="text-align:center">Image Gallery</h2>
  <div id="gallery"></div>

  <div id="modalOverlay">
    <div id="modalContent">
      <img id="modalImage" src="" alt="">
      <p id="modalCaption"></p>
    </div>
  </div>

  <script>
    const gallery = document.getElementById("gallery");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalContent = document.getElementById("modalContent");
    const modalImage = document.getElementById("modalImage");
    const modalCaption = document.getElementById("modalCaption");

    // Six sample images (small version for the grid, large version for the modal)
    const imageIds = [10, 20, 30, 40, 50, 60];

    imageIds.forEach((id, index) => {
      const thumbnail = document.createElement("img");
      thumbnail.src = "https://picsum.photos/id/" + id + "/400/300";
      thumbnail.alt = "Gallery image " + (index + 1);
      thumbnail.dataset.large = "https://picsum.photos/id/" + id + "/1000/700";
      gallery.appendChild(thumbnail);
    });

    function openModal(largeSrc, altText) {
      modalImage.src = largeSrc;
      modalImage.alt = altText;
      modalCaption.textContent = altText;
      modalOverlay.classList.add("open");
    }

    function closeModal() {
      modalOverlay.classList.remove("open");
      modalImage.src = "";
    }

    // Event delegation: one listener on the grid handles all six images
    gallery.addEventListener("click", (event) => {
      if (event.target.tagName === "IMG") {
        openModal(event.target.dataset.large, event.target.alt);
      }
    });

    // Clicking the dark overlay (outside the modal box) closes the modal
    modalOverlay.addEventListener("click", closeModal);

    // Clicks inside the modal box must NOT bubble up to the overlay
    modalContent.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    // Bonus: Escape key closes the modal
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
