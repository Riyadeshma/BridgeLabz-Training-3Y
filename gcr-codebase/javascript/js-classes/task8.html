<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Object Updater</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 30px auto; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 16px; }
    #display { background: #f4f4f4; padding: 10px; margin-top: 16px; }
  </style>
</head>
<body>
  <h2>Edit User</h2>
  <form id="userForm">
    <label>Name</label>
    <input type="text" id="name">
    <label>Email</label>
    <input type="email" id="email">
    <label>Age</label>
    <input type="number" id="age">
    <button type="submit">Update</button>
  </form>
  <div id="display"></div>
  <script src="q8.js"></script>
</body>
</html>
