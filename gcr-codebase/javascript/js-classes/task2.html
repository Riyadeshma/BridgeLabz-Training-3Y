<!-- q2.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 30px auto; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 2px solid #ccc; }
    input.valid { border-color: green; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 12px; min-height: 16px; }
    button { margin-top: 10px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Student Registration</h2>
  <form id="regForm" novalidate>
    <label>Name</label>
    <input type="text" id="name"><div class="error" id="nameError"></div>
    <label>Email</label>
    <input type="text" id="email"><div class="error" id="emailError"></div>
    <label>Phone</label>
    <input type="text" id="phone"><div class="error" id="phoneError"></div>
    <label>Password</label>
    <input type="password" id="password"><div class="error" id="passwordError"></div>
    <button type="submit">Register</button>
  </form>
  <p id="result"></p>
  <script src="q2.js"></script>
</body>
</html>
