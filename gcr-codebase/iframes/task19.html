<!DOCTYPE html>
<html>
<head>
    <title>Form Security Attributes</title>
</head>
<body>
    <h1>Secure Login Form</h1>
    <form method="post" action="#" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Login">
    </form>
    <p>Turning off autocomplete prevents the browser from storing and auto-filling sensitive information such as usernames and passwords, reducing the risk of misuse on shared devices.</p>
</body>
</html>
