<!DOCTYPE html>
<html>
<head>
    <title>Form with Iframe Result</title>
</head>
<body>
    <h1>Submit the Form</h1>
    <form method="get" action="result.html" target="resultFrame">
        <label for="message">Enter text:</label>
        <input type="text" id="message" name="message">
        <input type="submit" value="Submit">
    </form>
    <br>
    <iframe name="resultFrame" src="about:blank" width="400" height="150" title="Result Frame"></iframe>
</body>
</html>
